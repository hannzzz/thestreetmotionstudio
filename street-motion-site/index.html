<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="canonical" href="https://thestreetmotionstudio.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#070707" />
    <meta name="geo.region" content="GB-BST" />
    <meta name="geo.placename" content="Bristol" />

    <!-- Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Street Motion Studio" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:url" content="https://thestreetmotionstudio.com/" />
    <meta property="og:title" content="Street Motion Studio | AI Promo Videos for Bristol &amp; Somerset Businesses" />
    <meta property="og:description" content="Cinematic promo videos, product images and Reels for local businesses. Free samples first. No filming needed." />
    <meta property="og:image" content="https://thestreetmotionstudio.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Street Motion Studio | AI Promo Videos for Bristol &amp; Somerset Businesses" />
    <meta name="twitter:description" content="Cinematic promo videos, product images and Reels for local businesses. Free samples first." />
    <meta name="twitter:image" content="https://thestreetmotionstudio.com/og-image.png" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Saira:ital,wght@0,600;0,700;0,800;1,700;1,800;1,900&display=swap" />

    <link rel="preload" as="image" href="/logo-wordmark-white.png" />
    <script>document.documentElement.classList.add('js')</script>

    <!-- Structured data: local business -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "@id": "https://thestreetmotionstudio.com/#business",
      "name": "Street Motion Studio",
      "url": "https://thestreetmotionstudio.com/",
      "logo": "https://thestreetmotionstudio.com/icon-512.png",
      "image": "https://thestreetmotionstudio.com/og-image.png",
      "email": "hannan@thestreetmotionstudio.com",
      "description": "Bristol-based AI creative studio making promo videos, product and brand images, Reels, TikToks, property walkthrough videos and monthly content packs for local businesses.",
      "priceRange": "££",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Bristol",
        "addressCountry": "GB"
      },
      "areaServed": [
        { "@type": "City", "name": "Bristol" },
        { "@type": "City", "name": "Bath" },
        { "@type": "City", "name": "Weston-super-Mare" },
        { "@type": "City", "name": "Taunton" },
        { "@type": "City", "name": "Wells" },
        { "@type": "AdministrativeArea", "name": "Somerset" },
        { "@type": "AdministrativeArea", "name": "North Somerset" },
        { "@type": "AdministrativeArea", "name": "Bath and North East Somerset" }
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "AI content services",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI promo videos" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI product and brand images" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Short-form Reels and TikToks" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Property walkthrough videos" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Monthly content packs" } }
        ]
      }
    }
    </script>
    <!--faq-schema-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>

    <!-- Static copy of the contact form so Netlify Forms can detect it -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="name" />
      <input name="business" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <select name="service"><option value="">-</option></select>
      <input name="website" />
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
